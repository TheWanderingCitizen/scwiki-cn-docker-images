name: MediaWiki security validation and image build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          push: false
          tags: scwiki-mediawiki:main-security-recovery
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate manifests, installed sources, platform and live advisories
        run: docker run --rm -v "$PWD:/checks:ro" --entrypoint sh scwiki-mediawiki:main-security-recovery /checks/scripts/validate.sh
      - name: Fresh isolated installation and business regression
        shell: pwsh
        run: ./tests/run.ps1
      - name: Install isolated developer lock and lint site code
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/workspace" -w /workspace/tools --entrypoint sh scwiki-mediawiki:main-security-recovery -c 'composer install --prefer-dist --no-interaction --no-scripts && vendor/bin/parallel-lint ../compat ../scripts ../tests ../config/LocalSettings.php'
      - name: Repeat locked installation and compare all references
        run: |
          docker buildx build --load --no-cache-filter builder -t scwiki-mediawiki:locked-repeat .
          docker run --rm -v "$PWD:/checks:ro" --entrypoint php scwiki-mediawiki:locked-repeat /checks/scripts/verify-installed.php
      - name: Preserve the tested image for main publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker save -o tested-image.tar scwiki-mediawiki:main-security-recovery
          docker image inspect scwiki-mediawiki:main-security-recovery --format '{{.Id}}' > tested-image-id.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tested-mediawiki-${{ github.sha }}
          path: tested-image*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require reviewed production rehearsal evidence
        run: python3 scripts/check-release.py
      - id: calver
        run: echo "version=$(date -u +%y.%m.%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-mediawiki-${{ github.sha }}
          path: /tmp/tested-mediawiki
      - name: Load and verify the exact image that passed validation
        run: |
          docker load -i /tmp/tested-mediawiki/tested-image.tar
          test "$(docker image inspect scwiki-mediawiki:main-security-recovery --format '{{.Id}}')" = "$(cat /tmp/tested-mediawiki/tested-image-id.txt)"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image to the existing main targets
        run: |
          docker tag scwiki-mediawiki:main-security-recovery ghcr.io/thewanderingcitizen/mediawiki:main-latest
          docker tag scwiki-mediawiki:main-security-recovery ghcr.io/thewanderingcitizen/mediawiki:main-${{ steps.calver.outputs.version }}
          docker push ghcr.io/thewanderingcitizen/mediawiki:main-latest
          docker push ghcr.io/thewanderingcitizen/mediawiki:main-${{ steps.calver.outputs.version }}
