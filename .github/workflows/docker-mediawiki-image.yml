name: SMW Mediawiki Image Build

on:
  push:
    branches: ['smw']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build complete application from production lock
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          push: false
          tags: scwiki-mediawiki:php2shell-fixed
      - name: Verify platform, installed references and advisory IDs
        run: docker run --rm -v "$PWD:/workspace:ro" scwiki-mediawiki:php2shell-fixed sh /workspace/scripts/verify-image.sh | tee image-validation.log
      - name: Install and audit isolated development tools
        run: |
          docker run --rm --user root -e COMPOSER_ALLOW_SUPERUSER=1 -v "$PWD:/workspace" -w /workspace/tools scwiki-mediawiki:php2shell-fixed sh -ec 'composer validate --no-check-publish; composer install --no-interaction --prefer-dist --no-scripts; composer check-platform-reqs; composer audit --locked'
      - name: Isolated MariaDB, Redis and FPM business regression
        shell: pwsh
        run: ./tests/run.ps1
      - name: Rebuild and recheck pinned production references
        run: |
          docker build -t scwiki-mediawiki:recheck .
          docker run --rm -v "$PWD:/workspace:ro" scwiki-mediawiki:recheck sh /workspace/scripts/verify-image.sh
      - name: Retain resolved security audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-dependency-audit
          path: |
            build/audit.json
            image-validation.log

  docker:
    needs: validate
    if: github.ref == 'refs/heads/smw' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Calver Version
        id: setcalver
        run: echo "package_version=$(TZ=Asia/Shanghai date +%y.%m.%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: true
          tags: starcitizentools/mediawiki:smw-latest,starcitizentools/mediawiki:smw-${{ steps.setcalver.outputs.package_version }}
