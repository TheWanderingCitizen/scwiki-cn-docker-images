services:
  mediawiki:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - './config/LocalSettings.php:/var/www/mediawiki/LocalSettings.php'
      - 'mediawiki-data:/var/www'
    env_file:
      - '.env'
    environment:
      - COMPOSER_ALLOW_SUPERUSER
      - DbName
      - DbPassword
      - DbServer
      - DbType
      - DbUser
      - OpenIDConnectClientID
      - OpenIDConnectClientSecret
      - OpenIDConnectProviderUrl
      - RedisAddress
      - RedisPassword
      - S3BucketDomain
      - S3BucketName
      - S3Endpoint
      - S3Key
      - S3Region
      - S3Secret
      - SecretKey
      - Server
      - SiteName
      - UpgradeKey
      - php_debug_config
      - production
      - wgMultiPurgeCloudFlareApiToken
      - wgMultiPurgeCloudFlareZoneId
      - MEDIAWIKI_VERSION
      - MEDIAWIKI_MAJOR_VERSION

  mediawiki-web:
    image: nginx:stable-bookworm@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
    restart: always
    volumes:
      - './config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
      - 'mediawiki-data:/var/www'
    depends_on:
      - mediawiki
volumes:
  mediawiki-data:
    name: mediawiki-data
